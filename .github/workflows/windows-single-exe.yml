name: Build Windows single EXE

on:
  push:
    branches:
      - "release/windows-single-exe"
    paths:
      - ".github/workflows/windows-single-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows x64 self-contained single file
        shell: pwsh
        run: |
          dotnet publish Backend/SchoolMedicalManagement/School-Medical-Management.API/SchoolMedicalManagement.API.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=false --output publish

      - name: Verify true single-file output
        shell: pwsh
        run: |
          $exe = Get-Item "publish/EduHealth-Local-TW.exe"
          if (-not $exe) { throw "EduHealth-Local-TW.exe was not produced." }
          $runtimeFiles = Get-ChildItem publish -File | Where-Object { $_.Extension -in @(".dll", ".json") }
          if ($runtimeFiles) {
            $runtimeFiles | ForEach-Object { Write-Host $_.FullName }
            throw "Publish output still requires sidecar runtime files."
          }
          Write-Host "EXE size: $($exe.Length) bytes"

      - name: Smoke test the actual EXE
        shell: pwsh
        env:
          CI: "true"
          ASPNETCORE_ENVIRONMENT: "Production"
          LocalServer__Url: "http://127.0.0.1:5099"
          LocalServer__AutoOpenBrowser: "false"
        run: |
          $appRoot = Join-Path $env:LOCALAPPDATA "EduHealth-Local-TW"
          if (Test-Path $appRoot) { Remove-Item $appRoot -Recurse -Force }
          $exe = (Resolve-Path "publish/EduHealth-Local-TW.exe").Path
          $proc = Start-Process $exe -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/health" -TimeoutSec 2
                if ($health.status -eq "healthy") { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw "Single EXE did not become healthy." }

            $db = Join-Path $appRoot "data/eduhealth-local-tw.db"
            $credentialFile = Join-Path $appRoot "data/初始登入資訊.txt"
            if (-not (Test-Path $db)) { throw "LocalAppData SQLite database was not created." }
            if (-not (Test-Path $credentialFile)) { throw "First-run credential file was not created." }

            $credentialText = Get-Content $credentialFile -Raw
            $usernameMatch = [regex]::Match($credentialText, "帳號：([^\r\n]+)")
            $passwordMatch = [regex]::Match($credentialText, "一次性密碼：([^\r\n]+)")
            if (-not $usernameMatch.Success -or -not $passwordMatch.Success) { throw "Could not parse first-run credentials." }

            $loginBody = @{
              username = $usernameMatch.Groups[1].Value.Trim()
              password = $passwordMatch.Groups[1].Value.Trim()
            } | ConvertTo-Json
            $login = Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/User/login" -Method Post -ContentType "application/json" -Body $loginBody -TimeoutSec 5
            $token = $login.data.token
            if (-not $token) { throw "Single EXE login did not return a JWT." }
            $headers = @{ Authorization = "Bearer $token" }

            $dashboard = Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/Dashboard/overview" -Headers $headers -TimeoutSec 5
            if ($dashboard.status -ne "200") { throw "Dashboard API failed in single EXE." }
            Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/Student" -Headers $headers -TimeoutSec 5 | Out-Null
            Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/MedicalEvent" -Headers $headers -TimeoutSec 5 | Out-Null

            $spa = Invoke-WebRequest -Uri "http://127.0.0.1:5099/" -UseBasicParsing -TimeoutSec 5
            if ($spa.StatusCode -ne 200 -or $spa.Content -notmatch '<div id="root"') { throw "Embedded React SPA is not being served by the EXE." }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Start-Sleep -Seconds 1
            if (Test-Path $appRoot) { Remove-Item $appRoot -Recurse -Force }
          }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "publish/EduHealth-Local-TW.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EduHealth-Local-TW.exe" | Out-File "publish/SHA256.txt" -Encoding ascii
          Write-Host $hash

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: EduHealth-Local-TW-win-x64
          path: |
            publish/EduHealth-Local-TW.exe
            publish/SHA256.txt
          if-no-files-found: error
          retention-days: 30
