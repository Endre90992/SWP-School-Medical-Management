name: Security audit

on:
  push:
    branches:
      - main
      - security/exe-package
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Require clean frontend dependency audit
        shell: pwsh
        working-directory: Frontend
        run: |
          npm audit --json | Out-File -Encoding utf8 npm-audit.json
          $audit = Get-Content npm-audit.json -Raw | ConvertFrom-Json
          $counts = $audit.metadata.vulnerabilities
          Write-Host ("AUDIT_COUNTS=" + ($counts | ConvertTo-Json -Compress))
          if ($counts.total -ne 0) {
            throw "Frontend dependency audit is not clean."
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln

      - name: Require clean backend dependency audit
        shell: pwsh
        run: |
          $output = dotnet list Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln package --vulnerable --include-transitive
          $output | ForEach-Object { Write-Host $_ }
          if (($output -join "`n") -match "has the following vulnerable packages") {
            throw "Backend dependency audit found vulnerable packages."
          }
