name: Build hardened Windows EXE

on:
  push:
    branches:
      - "security/release-hardening"
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Security gate - frontend production dependencies
        shell: pwsh
        working-directory: Frontend
        run: |
          npm audit --omit=dev --json | Out-File -Encoding utf8 npm-audit.json
          $audit = Get-Content npm-audit.json -Raw | ConvertFrom-Json
          Write-Host ("critical=" + $audit.metadata.vulnerabilities.critical)
          Write-Host ("high=" + $audit.metadata.vulnerabilities.high)
          Write-Host ("moderate=" + $audit.metadata.vulnerabilities.moderate)
          if ($audit.metadata.vulnerabilities.critical -gt 0 -or $audit.metadata.vulnerabilities.high -gt 0) {
            throw "High/Critical frontend dependency vulnerabilities remain."
          }

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln

      - name: Security gate - .NET dependencies
        shell: pwsh
        run: |
          $output = dotnet list Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln package --vulnerable --include-transitive
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { throw ".NET vulnerability audit command failed." }
          if (($output -join "\n") -match "\b(High|Critical)\b") { throw "High/Critical .NET dependency vulnerabilities remain." }

      - name: Publish self-contained single-file Windows EXE
        shell: pwsh
        run: |
          dotnet publish Backend/SchoolMedicalManagement/School-Medical-Management.API/SchoolMedicalManagement.API.csproj --configuration Release --runtime win-x64 --self-contained true --output single-exe -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false
          $source = "single-exe/SchoolMedicalManagement.API.exe"
          if (-not (Test-Path $source)) { throw "Single-file executable was not produced." }
          Move-Item $source "single-exe/EduHealth-Local-TW.exe" -Force

      - name: Verify single executable layout
        shell: pwsh
        run: |
          $exe = Get-Item "single-exe/EduHealth-Local-TW.exe"
          Write-Host ("EXE bytes=" + $exe.Length)
          if ($exe.Length -lt 10MB) { throw "Executable is unexpectedly small; self-contained bundle may be incomplete." }

      - name: Smoke test the actual EXE
        shell: pwsh
        env:
          LocalServer__OpenBrowser: "false"
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "eduhealth-single-exe-test"
          Remove-Item $testDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $testDir | Out-Null
          Copy-Item "single-exe/EduHealth-Local-TW.exe" $testDir
          $exePath = Join-Path $testDir "EduHealth-Local-TW.exe"
          $stdoutPath = Join-Path $testDir "eduhealth.stdout.log"
          $stderrPath = Join-Path $testDir "eduhealth.stderr.log"
          $extractBase = Join-Path $testDir "bundle-extract"
          New-Item -ItemType Directory -Path $extractBase -Force | Out-Null
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = $extractBase
          $proc = Start-Process $exePath -WorkingDirectory $testDir -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:5080/api/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw "Single-file EXE did not become healthy." }

            $db = Join-Path $testDir "data/eduhealth-local-tw.db"
            $credentialFile = Join-Path $testDir "data/初始登入資訊.txt"
            if (-not (Test-Path $db)) { throw "SQLite database was not created beside the executable." }
            if (-not (Test-Path $credentialFile)) { throw "First-run credentials were not created beside the executable." }

            $credentialText = Get-Content $credentialFile -Raw
            $usernameMatch = [regex]::Match($credentialText, "帳號：([^\r\n]+)")
            $passwordMatch = [regex]::Match($credentialText, "一次性密碼：([^\r\n]+)")
            if (-not $usernameMatch.Success -or -not $passwordMatch.Success) { throw "Could not parse first-run credentials." }

            $loginBody = @{ username = $usernameMatch.Groups[1].Value.Trim(); password = $passwordMatch.Groups[1].Value.Trim() } | ConvertTo-Json
            $login = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/User/login" -Method Post -ContentType "application/json" -Body $loginBody -TimeoutSec 5
            $token = $login.data.token
            if (-not $token) { throw "Login did not return a JWT." }

            $headers = @{ Authorization = "Bearer $token" }
            $dashboard = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/Dashboard/overview" -Headers $headers -TimeoutSec 5
            if ($dashboard.status -ne "200") { throw "Dashboard smoke test failed." }
            Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/Student" -Headers $headers -TimeoutSec 5 | Out-Null
            Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/MedicalEvent" -Headers $headers -TimeoutSec 5 | Out-Null

            $spa = Invoke-WebRequest -Uri "http://127.0.0.1:5080/" -UseBasicParsing -TimeoutSec 5
            if ($spa.StatusCode -ne 200 -or $spa.Content -notmatch '<div id="root"') { throw "Bundled SPA smoke test failed." }
          } catch {
            if ($proc) {
              $proc.Refresh()
              Write-Host ("ProcessExited=" + $proc.HasExited)
              if ($proc.HasExited) { Write-Host ("ProcessExitCode=" + $proc.ExitCode) }
            }
            if (Test-Path $stdoutPath) {
              Write-Host "===== EduHealth stdout ====="
              Get-Content $stdoutPath -Raw | Write-Host
            }
            if (Test-Path $stderrPath) {
              Write-Host "===== EduHealth stderr ====="
              Get-Content $stderrPath -Raw | Write-Host
            }
            if (Test-Path $extractBase) {
              Write-Host "===== Bundle extraction files ====="
              Get-ChildItem $extractBase -Recurse -File |
                Select-Object -ExpandProperty FullName |
                Write-Host
            }
            throw
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = Get-FileHash "single-exe/EduHealth-Local-TW.exe" -Algorithm SHA256
          $hash.Hash | Out-File "single-exe/EduHealth-Local-TW.exe.sha256.txt" -Encoding ascii
          Write-Host ("SHA256=" + $hash.Hash)

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduHealth-Local-TW-win-x64
          path: |
            single-exe/EduHealth-Local-TW.exe
            single-exe/EduHealth-Local-TW.exe.sha256.txt
          if-no-files-found: error
          retention-days: 30
