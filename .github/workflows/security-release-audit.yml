name: Security release audit

on:
  push:
    branches:
      - "release/windows-single-exe"

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: Frontend
        shell: pwsh
        run: |
          npm audit --json | Out-File -Encoding utf8 npm-audit.json
          $auditExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          $audit = Get-Content npm-audit.json -Raw | ConvertFrom-Json
          $meta = $audit.metadata.vulnerabilities
          Write-Host "npm audit: critical=$($meta.critical) high=$($meta.high) moderate=$($meta.moderate) low=$($meta.low)"

          foreach ($property in $audit.vulnerabilities.PSObject.Properties) {
            $item = $property.Value
            if ($item.severity -in @("critical", "high")) {
              $via = @($item.via | ForEach-Object {
                if ($_ -is [string]) { $_ }
                elseif ($_.title) { $_.title }
              }) -join " | "
              Write-Host "AUDIT $($item.severity.ToUpper()) :: $($property.Name) :: direct=$($item.isDirect) :: range=$($item.range) :: fix=$($item.fixAvailable) :: via=$via"
            }
          }

          if (($meta.critical -gt 0) -or ($meta.high -gt 0)) {
            Write-Host "::warning::High or critical npm vulnerabilities remain."
          }

      - name: Frontend production build
        working-directory: Frontend
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln

      - name: Audit vulnerable .NET packages
        shell: pwsh
        run: |
          dotnet list Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln package --vulnerable --include-transitive | Tee-Object dotnet-vulnerable.txt

      - name: Build
        run: dotnet build Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln --configuration Release --no-restore

      - name: Static secret/network scan
        shell: pwsh
        run: |
          $patterns = @(
            'onrender\.com',
            'vercel\.app',
            'schoolmedicalmanagement\.id\.vn',
            'smtp\.gmail\.com',
            'redis-[^\s"]+',
            'Data Source=.*;.*Password=',
            'Jwt.*Key.*[^"]{16,}'
          )
          foreach ($pattern in $patterns) {
            $matches = Get-ChildItem -Recurse -File -Include *.cs,*.json,*.jsx,*.js,*.yml,*.yaml |
              Where-Object { $_.FullName -notmatch 'node_modules|dist|bin|obj|\.git' } |
              Select-String -Pattern $pattern
            if ($matches) {
              Write-Host "::warning::Pattern matched: $pattern"
              $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber)" }
            }
          }

      - name: Dangerous frontend sink scan
        shell: pwsh
        run: |
          $matches = Get-ChildItem Frontend/src -Recurse -File -Include *.jsx,*.js |
            Select-String -Pattern 'dangerouslySetInnerHTML|innerHTML\s*='
          if ($matches) {
            Write-Host "::warning::Potential HTML injection sinks detected"
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          } else {
            Write-Host "No dangerous HTML sinks detected."
          }
