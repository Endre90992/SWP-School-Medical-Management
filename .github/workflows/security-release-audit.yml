name: Security release audit
# Release gate: high/critical frontend issues, vulnerable .NET packages, secrets,
# external-cloud dependencies, or unsafe HTML sinks block EXE packaging.

on:
  push:
    branches:
      - "release/windows-single-exe"

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Frontend dependency audit gate
        working-directory: Frontend
        shell: pwsh
        run: |
          npm audit --json | Out-File -Encoding utf8 npm-audit.json
          $global:LASTEXITCODE = 0

          $audit = Get-Content npm-audit.json -Raw | ConvertFrom-Json
          $meta = $audit.metadata.vulnerabilities
          Write-Host "npm audit: critical=$($meta.critical) high=$($meta.high) moderate=$($meta.moderate) low=$($meta.low)"

          foreach ($property in $audit.vulnerabilities.PSObject.Properties) {
            $item = $property.Value
            if ($item.severity -in @("critical", "high", "moderate")) {
              $via = @($item.via | ForEach-Object {
                if ($_ -is [string]) { $_ }
                elseif ($_.title) { $_.title }
              }) -join " | "
              Write-Host "AUDIT $($item.severity.ToUpper()) :: $($property.Name) :: direct=$($item.isDirect) :: range=$($item.range) :: fix=$($item.fixAvailable) :: via=$via"
            }
          }

          if (($meta.critical -gt 0) -or ($meta.high -gt 0)) {
            throw "Release blocked: high/critical npm vulnerabilities remain."
          }

      - name: Frontend production build
        working-directory: Frontend
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln

      - name: Audit vulnerable .NET packages
        shell: pwsh
        run: |
          $output = dotnet list Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln package --vulnerable --include-transitive
          $output | Tee-Object dotnet-vulnerable.txt
          if ($output -match "has the following vulnerable packages") {
            throw "Release blocked: vulnerable .NET packages remain."
          }

      - name: Build
        run: dotnet build Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln --configuration Release --no-restore

      - name: Static secret and external-network gate
        shell: pwsh
        run: |
          $sourceFiles = @(
            Get-ChildItem Backend -Recurse -File -Include *.cs,*.json,*.csproj
            Get-ChildItem Frontend/src -Recurse -File -Include *.js,*.jsx
          )

          $patterns = @(
            'onrender\.com',
            'vercel\.app',
            'schoolmedicalmanagement\.id\.vn',
            'smtp\.gmail\.com',
            'Data Source=.*Password=',
            'Server=.*Password=',
            '"SmtpPassword"\s*:\s*"[^"]+"',
            '"Key"\s*:\s*"[^"]{16,}"'
          )

          $found = $false
          foreach ($pattern in $patterns) {
            $matches = $sourceFiles | Select-String -Pattern $pattern
            if ($matches) {
              $found = $true
              Write-Host "::error::Sensitive/external pattern matched: $pattern"
              $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber)" }
            }
          }

          if ($found) {
            throw "Release blocked: secret or external-network pattern detected."
          }

      - name: Dangerous frontend sink gate
        shell: pwsh
        run: |
          $matches = Get-ChildItem Frontend/src -Recurse -File -Include *.jsx,*.js |
            Select-String -Pattern 'dangerouslySetInnerHTML|\.innerHTML\s*='

          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "::error::$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw "Release blocked: unsafe HTML sink detected."
          }

          Write-Host "No dangerous HTML sinks detected."
