name: Security release audit

on:
  push:
    branches:
      - "security/**"

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Frontend production dependency audit
        shell: pwsh
        working-directory: Frontend
        run: |
          npm audit --omit=dev --json | Out-File -Encoding utf8 npm-audit.json
          $audit = Get-Content npm-audit.json -Raw | ConvertFrom-Json
          Write-Host ("AUDIT_TOTAL=" + $audit.metadata.vulnerabilities.total)
          Write-Host ("AUDIT_CRITICAL=" + $audit.metadata.vulnerabilities.critical)
          Write-Host ("AUDIT_HIGH=" + $audit.metadata.vulnerabilities.high)
          Write-Host ("AUDIT_MODERATE=" + $audit.metadata.vulnerabilities.moderate)
          Write-Host ("AUDIT_LOW=" + $audit.metadata.vulnerabilities.low)
          foreach ($p in $audit.vulnerabilities.PSObject.Properties) {
            $v = $p.Value
            Write-Host ("VULN " + $p.Name + " severity=" + $v.severity + " direct=" + $v.isDirect + " range=" + $v.range)
            foreach ($via in $v.via) {
              if ($via -is [string]) {
                Write-Host ("  VIA " + $via)
              } else {
                Write-Host ("  VIA " + $via.title + " url=" + $via.url + " range=" + $via.range)
              }
            }
          }
          exit 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln

      - name: .NET vulnerable package audit
        shell: pwsh
        run: |
          dotnet list Backend/SchoolMedicalManagement/SchoolMedicalManagement.sln package --vulnerable --include-transitive
