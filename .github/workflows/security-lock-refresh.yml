name: Refresh security lockfile

on:
  push:
    branches:
      - "security/release-hardening"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/release-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh package lock
        working-directory: Frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- Frontend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/package-lock.json
          git commit -m "build: refresh lockfile after restoring react-calendar"
          git push origin HEAD:security/release-hardening
