name: Build single EXE

on:
  push:
    branches:
      - security/exe-package
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single file
        shell: pwsh
        run: |
          dotnet publish Backend/SchoolMedicalManagement/School-Medical-Management.API/SchoolMedicalManagement.API.csproj --configuration Release --runtime win-x64 --self-contained true --output exe-publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:IncludeAllContentForSelfExtract=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:DebugSymbols=false /p:AssemblyName=EduHealth-Local-TW
          $exe = Get-Item "exe-publish/EduHealth-Local-TW.exe"
          Write-Host ("EXE_SIZE_BYTES=" + $exe.Length)

      - name: Test EXE in an empty directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path single-test | Out-Null
          Copy-Item "exe-publish/EduHealth-Local-TW.exe" "single-test/EduHealth-Local-TW.exe"

          $before = @(Get-ChildItem single-test -File)
          if ($before.Count -ne 1 -or $before[0].Extension -ne ".exe") {
            throw "Single-file test directory must contain only one EXE before startup."
          }

          $env:EDUHEALTH_DISABLE_BROWSER = "1"
          $proc = Start-Process ".\EduHealth-Local-TW.exe" -WorkingDirectory "single-test" -PassThru

          try {
            $healthy = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:5080/api/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
              }
            }

            if (-not $healthy) {
              throw "Single EXE did not become healthy."
            }

            $credentialFile = "single-test/data/初始登入資訊.txt"
            if (-not (Test-Path $credentialFile)) {
              throw "Single EXE did not create first-run credentials."
            }

            $credentialText = Get-Content $credentialFile -Raw
            $username = [regex]::Match($credentialText, "帳號：([^\r\n]+)").Groups[1].Value.Trim()
            $password = [regex]::Match($credentialText, "一次性密碼：([^\r\n]+)").Groups[1].Value.Trim()
            if (-not $username -or -not $password) {
              throw "Unable to parse first-run credentials."
            }

            $loginBody = @{ username = $username; password = $password } | ConvertTo-Json
            $login = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/User/login" -Method Post -ContentType "application/json" -Body $loginBody -TimeoutSec 5
            $token = $login.data.token
            if (-not $token) {
              throw "Single EXE login failed."
            }

            $headers = @{ Authorization = "Bearer $token" }
            $dashboard = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/Dashboard/overview" -Headers $headers -TimeoutSec 5
            if ($dashboard.status -ne "200") {
              throw "Dashboard smoke test failed."
            }

            $spa = Invoke-WebRequest -Uri "http://127.0.0.1:5080/" -UseBasicParsing -TimeoutSec 5
            if ($spa.StatusCode -ne 200 -or $spa.Content -notmatch '<div id="root"') {
              throw "Bundled React SPA was not served by the single EXE."
            }
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

          Remove-Item "single-test/data" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: EduHealth-Local-TW-win-x64
          path: single-test/EduHealth-Local-TW.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
